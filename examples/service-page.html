<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field services directory</title>
  <style>
    body {
      max-width: 44rem;
      margin: 8vh auto;
      padding: 1rem;
      font: 1.15rem/1.6 system-ui;
      color: #17312b;
      background: #faf8f1;
    }
    article { border-top: 1px solid #85968c; }
    select { font: inherit; max-width: 100%; }
  </style>
</head>
<body>
  <main>
    <h1>Field services directory</h1>
    <label for="area">Service area</label>
    <select id="area"></select>
    <section aria-live="polite" aria-label="Available services" id="services"></section>
    <noscript>Enable JavaScript to choose a district and view its services.</noscript>
  </main>
  <script>
    const catalog = [
      {
        area: "North district",
        service: "Site grading",
        detail: "Prepare building pads and establish drainage."
      },
      {
        area: "South district",
        service: "Utility trenching",
        detail: "Prepare trenches for planned utility routes."
      }
    ];
    const menu = document.querySelector("#area");
    const results = document.querySelector("#services");

    for (const area of new Set(catalog.map(item => item.area))) {
      menu.add(new Option(area));
    }

    function render() {
      results.replaceChildren();
      for (const item of catalog.filter(item => item.area === menu.value)) {
        const article = document.createElement("article");
        const title = document.createElement("h2");
        const detail = document.createElement("p");
        title.textContent = item.service;
        detail.textContent = item.detail;
        article.append(title, detail);
        results.append(article);
      }
    }

    menu.addEventListener("change", render);
    render();
  </script>
</body>
</html>
