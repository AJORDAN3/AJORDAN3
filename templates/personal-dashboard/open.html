<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily briefing template</title><style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#fbf8f2;color:#302e30;font:1rem/1.56 'DM Sans',system-ui,sans-serif}
main,nav{width:min(72rem,calc(100% - 2.5rem));margin:auto}nav{display:flex;border-bottom:1px solid #cec6ba;align-items:center;padding:1.15rem 0}nav a{color:#473f47;font-weight:650;text-decoration:none}nav a:hover{text-decoration:underline}
h1,h2,legend,.name{font-family:'DM Serif Text',Georgia,serif;font-weight:500}h1{font-size:clamp(2.65rem,6.2vw,5.4rem);line-height:.98;letter-spacing:-.05em;margin:0 0 1rem}h2,legend{font-size:1.65rem;line-height:1.18}p{margin:0;max-width:53ch}
header{position:relative;background:var(--wash);border:1px solid color-mix(in srgb,var(--ink) 26%,white);border-radius:1.35rem;overflow:hidden;padding:clamp(1.6rem,4vw,3.7rem);margin:1.7rem 0;display:flex;align-items:center;justify-content:space-between;gap:1rem;color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(15rem,.85fr);gap:clamp(1rem,3vw,2.5rem);align-items:start;margin-bottom:4rem}
fieldset,.preview{min-width:0;margin:0 0 1.3rem;padding:1.4rem;background:#fffefa;border:1px solid #cfc7bb;border-radius:1rem}legend{padding:0 .45rem;color:var(--ink)}label{display:block;margin:.45rem 0 1rem;font-weight:650}
textarea,select{font:inherit;display:block;margin-top:.3rem;width:100%;border:1px solid #a49c92;background:white;padding:.65rem;border-radius:.55rem;color:inherit}textarea{resize:vertical}button{font:inherit;font-weight:650;color:var(--ink);background:var(--wash);border:1px solid var(--ink);padding:.55rem .95rem;border-radius:2rem;cursor:pointer}button:hover{filter:brightness(.95)}fieldset button{background:transparent;border-color:#b8aea3;font-size:.875rem}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ink,#543d61);outline-offset:3px}
.preview{background:repeating-linear-gradient(#fffefa 0 1.67rem,#e9e4da 1.67rem 1.72rem);border-top:.45rem solid var(--ink);position:sticky;top:1rem;box-shadow:.25rem .32rem 0 #e8e2d7}.preview h2{margin:0;color:var(--ink)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.72rem;max-height:42vh;overflow:auto}.preview button{background:var(--ink);color:white}.hint{font-size:.88rem;margin-top:.65rem;color:#57514d}
.art{flex:none;position:relative;display:grid;place-items:center;width:9rem;height:7rem;color:var(--ink);transform:rotate(-6deg);isolation:isolate}.art:before,.art:after,.art i,.art i:before,.art i:after{content:"";position:absolute}.art:before{inset:.65rem .55rem;background:#fffaf0;border:2px solid;border-radius:.65rem;box-shadow:4px 5px 0 var(--ink)}.art b{position:absolute;font:italic bold 1rem Georgia,serif;bottom:1.05rem}
.avatar{width:2.1rem;height:2.1rem;border-radius:100%;background:var(--wash);left:1.2rem;top:2rem}.avatar:before{width:.65rem;height:.65rem;background:currentColor;border-radius:100%;left:.72rem;top:.32rem}.avatar:after{width:1.2rem;height:.6rem;background:currentColor;left:.44rem;bottom:.38rem;border-radius:.7rem .7rem .2rem .2rem}.bio{width:3.5rem;height:.22rem;background:var(--ink);left:4rem;top:2.55rem;box-shadow:0 .65rem 0 var(--wash)}
.sunrise:before{border-radius:4rem 4rem .4rem .4rem}.sun{background:#e6a43c;width:1.9rem;height:1.9rem;top:1.4rem;border-radius:50%}.hill{width:5rem;height:1.1rem;border-top:3px solid;border-radius:50%;top:3.18rem}
.ticket:before{border-radius:.2rem;inset:1.25rem .35rem;background:repeating-linear-gradient(90deg,#fffaf0 0 4px,var(--wash) 4px 6px)}.ticket b{background:#fffaf0;border-block:1px solid;bottom:2.45rem;left:1.05rem;padding:0 .3rem}.stub{height:3.4rem;top:1.75rem;right:2rem;border-left:2px dashed}
.prints:before{border-radius:0;transform:rotate(9deg);box-shadow:4px 5px 0 var(--ink),-5px 3px 0 white}.mountain{width:5.4rem;height:2.5rem;background:var(--ink);top:1.45rem;clip-path:polygon(0 100%,36% 12%,57% 63%,73% 32%,100% 100%)}
.conversation:before{inset:.7rem 1.9rem 2rem .5rem;background:var(--wash);border-radius:1.2rem}.bubble{inset:2.3rem .5rem 1rem 2.5rem;border:2px solid;background:#fffaf0;border-radius:1rem 1rem .15rem 1rem}.conversation b{bottom:2rem;right:1.1rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:1rem;margin:1.6rem 0 3rem}.card{display:flex;flex-direction:column;align-items:start;color:var(--ink);text-decoration:none;background:#fffefa;border:1px solid #cec6ba;border-radius:1rem;overflow:hidden}.card:hover{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}.swatch{display:grid;place-items:center;width:100%;background:var(--wash);padding:.7rem}.name{font-size:1.5rem;padding:.8rem 1rem}.intro{padding:3rem 0 .45rem}.intro h1{max-width:12ch}
@media(max-width:700px){.layout{grid-template-columns:1fr}.preview{position:static}.art{zoom:.78}header{gap:.3rem}header p{font-size:.95rem}}@media(max-width:480px){header{align-items:flex-start;flex-direction:column-reverse}.art{zoom:.68}nav,main{width:calc(100% - 1.5rem)}}
</style></head><body style="--ink:#774419;--wash:#ffebbb"><nav aria-label="Template collection"><a href="https://ajordan3-templates.ashleigh24jordan.chatgpt.site/">AJ’s templates</a></nav><main><header><div><h1>Daily briefing</h1><p>Plan your day and keep the next action beside each item.</p></div><span aria-hidden="true" class="art sunrise"><i class="sun"></i><i class="hill"></i><b>Today</b></span></header><div class="layout"><form><fieldset id="header"><legend>Overview</legend></fieldset><div id="rows"></div><button type="button" id="add">Add another briefing item</button></form><section class="preview"><h2>Preview</h2><pre id="preview"></pre><button type="button" id="save">Save a text copy</button><p class="hint">Save your copy before closing this tab.</p></section></div></main><script>const config = ["Daily briefing","Plan your day and keep the next action beside each item.",["Briefing date","Today’s priority"],"Briefing item",["Area (schedule, tasks, or inbox)","Item","Next action"]];
const form = document.querySelector("form");
const rows = document.querySelector("#rows");
const preview = document.querySelector("#preview");
function fields(container, labels, values = []) {
  labels.forEach((label, i) => {
    const wrapper = document.createElement("label");
    wrapper.textContent = label;
    const input = document.createElement(label === "Activity" ? "select" : "textarea");
    if (label === "Activity") {
      for (const activity of ["Check-in", "Volunteer signup"]) input.add(new Option(activity, activity));
    } else input.rows = 2;
    if (values[i]) input.value = values[i];
    wrapper.append(input);
    container.append(wrapper);
  });
}
function addRow() {
  const row = document.createElement("fieldset");
  const legend = document.createElement("legend");
  legend.textContent = config[3];
  row.append(legend);
  fields(row, config[4]);
  const remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = "Remove entry";
  remove.onclick = () => { row.remove(); update(); };
  row.append(remove);
  rows.append(row);
  return row;
}
function entries(group) {
  return [...group.querySelectorAll("textarea, select")].map(input => input.value.trim());
}
function update() {
  const header = entries(document.querySelector("#header"));
  const lines = header.flatMap((v,i) => v ? [config[2][i] + ": " + v] : []);
  const visits = new Map(), volunteers = new Map(), people = new Set();
  for (const row of rows.children) {
    const values = entries(row);
    if (config[0] === "Event attendance") {
      const [event, member, action] = values;
      if (!event || !member) continue;
      const key = JSON.stringify([event.toLowerCase(), member.toLowerCase()]);
      const target = action === "Check-in" ? visits : volunteers;
      if (target.has(key)) continue;
      target.set(key, true);
      if (action === "Check-in") people.add(member.toLowerCase());
    }
    if (values.some(Boolean)) lines.push("", ...values.flatMap((v,i) => v ? [config[4][i] + ": " + v] : []));
  }
  if (config[0] === "Event attendance") lines.push("", "Check-ins: "+visits.size+" · Distinct attendees: "+people.size+" · Volunteer signups: "+volunteers.size);
  preview.textContent = lines.join("\n").trim() || "Your completed template will appear here.";
}
fields(document.querySelector("#header"), config[2]);
addRow();
document.querySelector("#add").onclick = () => { const row = addRow(); row.querySelector("textarea").focus(); update(); };
form.oninput = update;
document.querySelector("#save").onclick = () => {
  const a = document.createElement("a");
  const blob = new Blob([config[0]+"\n\n"+preview.textContent+"\n"], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  a.href=url; a.download=config[0].toLowerCase().replaceAll(" ","-")+".txt"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
update();</script></body></html>
